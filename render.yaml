services:
  - type: web
    name: wind-desk-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: CORS_ORIGINS
        sync: false
